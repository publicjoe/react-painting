name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build first: it starts with tsc -b, so type errors fail the run before
      # lint and tests give a false green on code that will not compile.
      - run: npm run build
      - run: npm run lint
      - run: npm test
